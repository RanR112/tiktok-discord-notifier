name: TikTok Monitor

# Menjalankan SATU siklus pengecekan (npm run once) secara terjadwal.
# Tidak ada proses yang hidup terus — GitHub Actions membuat runner baru
# setiap kali jadwal ini terpicu, menjalankan satu siklus, lalu runner-nya
# dibuang. State (anti-duplikat) dipertahankan dengan cara di-commit balik
# ke repo di akhir setiap run.
#
# CATATAN: jadwal cron GitHub Actions bersifat best-effort — bisa meleset
# beberapa menit saat traffic GitHub tinggi. Untuk deteksi LIVE yang butuh
# presisi tinggi, VPS dengan proses yang hidup terus (lihat README) lebih
# tepat waktu. Ini trade-off yang disengaja demi hosting gratis tanpa kartu.
#
# CATATAN: GitHub otomatis MENONAKTIFKAN scheduled workflow pada repo yang
# tidak ada aktivitas (commit apa pun) selama 60 hari. Ini TIDAK jadi masalah
# di sini: `lastCheckedAt` di data/state.json berubah setiap siklus, jadi
# langkah "Simpan state kembali ke repo" di bawah SELALU menghasilkan commit
# baru setiap kali workflow ini jalan (tiap 5 menit) -- repo otomatis tetap
# "aktif" dengan sendirinya, tanpa perlu commit manual apa pun.

on:
  schedule:
    - cron: '*/10 * * * *' # sementara 10 menit dulu untuk memicu GitHub mendaftar ulang jadwal.
  workflow_dispatch: {} # tombol "Run workflow" manual di tab Actions, untuk testing

# Mencegah dua run tumpang tindih (mis. run terjadwal + manual bersamaan)
# saling menimpa commit state satu sama lain.
concurrency:
  group: tiktok-monitor
  cancel-in-progress: false

# Wajib: token bawaan GITHUB_TOKEN butuh izin ini untuk bisa mem-push
# commit state kembali ke repo.
permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Jalankan satu siklus pengecekan
        env:
          TIKTOK_USERNAME: ${{ secrets.TIKTOK_USERNAME }}
          DISCORD_LIVE_WEBHOOK_URL: ${{ secrets.DISCORD_LIVE_WEBHOOK_URL }}
          DISCORD_CONTENT_WEBHOOK_URL: ${{ secrets.DISCORD_CONTENT_WEBHOOK_URL }}
          # Nilai ini wajib diisi validator config walau di mode --once
          # loop-nya tidak dipakai. Kadensi sesungguhnya diatur oleh cron
          # di atas, bukan variable ini.
          CHECK_INTERVAL: '60000'
        run: npm run once

      - name: Simpan state kembali ke repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # -f diperlukan karena data/state.json ada di .gitignore (disengaja,
          # supaya pengembangan lokal tidak pernah tanpa sadar meng-commit
          # state percobaan). Di sinilah satu-satunya tempat file itu
          # sengaja ditambahkan secara paksa.
          git add -f data/state.json

          if git diff --cached --quiet; then
            echo "State tidak berubah, tidak ada commit baru."
            exit 0
          fi

          git commit -m "chore: update monitor state [skip ci]"

          # Jaga-jaga kalau ada commit lain masuk di antara checkout dan push.
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
